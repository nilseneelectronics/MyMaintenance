<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - MyMaintenance</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .cal-page { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
        .cal-page h1 { text-align: left; margin-bottom: 8px; }
        .cal-view-toggle { display: flex; gap: 8px; margin-bottom: 24px; justify-content: center; }
        .cal-view-toggle button { padding: 8px 20px; border: 1.5px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); cursor: pointer; color: var(--text-primary); font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: all 0.2s; }
        .cal-view-toggle button.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .cal-nav { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; min-height: 40px; }
        .cal-nav button { position: absolute; padding: 6px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); cursor: pointer; font-size: 1rem; color: var(--accent-primary); }
        .cal-nav button:first-child { left: 0; }
        .cal-nav button:last-child { right: 0; }
        .cal-nav span { font-size: 1.2rem; font-weight: 600; text-align: center; }

        #cal-content { min-height: 560px; }

        /* Add happening button */
        .add-event-top { width: 100%; padding: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background: transparent; color: var(--accent-primary); font-family: 'Poppins', sans-serif; font-size: 0.95rem; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
        .add-event-top:hover { background: rgba(32,178,170,0.05); border-color: var(--accent-primary); }
        .add-event-bottom { display: block; width: 100%; padding: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background: transparent; color: var(--accent-primary); font-family: 'Poppins', sans-serif; font-size: 0.95rem; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
        .add-event-bottom:hover { background: rgba(32,178,170,0.05); border-color: var(--accent-primary); }

        /* Year grid */
        .year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .year-month { border: 1.5px solid var(--border-color); border-radius: 12px; padding: 16px; background: var(--bg-primary); }
        .year-month h3 { margin: 0 0 8px; font-size: 1rem; text-align: center; }
        .year-month table { width: 100%; border-collapse: collapse; }
        .year-month th { font-size: 0.65rem; padding: 2px 0; color: var(--text-secondary); font-weight: 500; }
        .year-month td { text-align: center; padding: 2px 0; font-size: 0.72rem; position: relative; }
        .year-month .date-circle { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; }
        .year-month .today .date-circle { background: var(--accent-primary); color: #fff; }
        .year-month td.has-event::after { content: ''; display: block; width: 10px; height: 2px; background: var(--accent-primary); border-radius: 2px; margin: 0 auto; margin-top: 2px; }
        .year-month td.today.has-event::after { background: #fff; }
        .year-month .past .date-circle { opacity: 0.3; }
        .year-month td.past.has-event::after { opacity: 0.35; }

        /* Month view – matches calendar-mimic style */
        .month-view-wrap { border: 1.5px solid var(--border-color); border-radius: 12px; padding: 20px; background: var(--bg-primary); }
        .month-view { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        .month-view th { text-align: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-weight: 500; color: var(--text-secondary); }
        .month-view td { text-align: center; padding: 8px 0; vertical-align: top; height: 100px; position: relative; }
        .month-view .date-circle { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border-color); font-size: 0.95rem; color: var(--text-primary); margin-bottom: 4px; }
        .month-view .today .date-circle { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
        .month-view .past .date-circle { opacity: 0.35; }
        .month-view .event-line { display: block; font-size: 0.65rem; color: var(--accent-secondary); background: rgba(32,178,170,0.1); border-radius: 3px; padding: 2px 6px; margin: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .month-view td:hover { background: var(--hover-bg); border-radius: 8px; }

        /* Day view */
        .day-view { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; min-height: 400px; }
        .day-view h2 { text-align: center; margin-bottom: 24px; }
        .day-view .day-body { flex: 1 1 auto; }
        .day-event { padding: 16px; border: 1.5px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; background: var(--bg-primary); }
        .day-event strong { display: block; font-size: 1rem; margin-bottom: 4px; }
        .day-event span { font-size: 0.85rem; color: var(--text-secondary); }
        .day-empty { text-align: center; color: var(--text-secondary); padding: 40px; }
        .day-view .add-event-bottom { margin-top: auto; }

        /* Add event modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: var(--bg-primary); border-radius: 16px; padding: 32px; max-width: 420px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
        .modal-card h3 { margin: 0 0 16px; font-size: 1.2rem; }
        .modal-card input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; background: var(--bg-secondary); color: var(--text-primary); box-sizing: border-box; margin-bottom: 16px; }
        .modal-card input:focus { outline: none; border-color: var(--accent-primary); }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
        .modal-buttons button { padding: 8px 20px; border-radius: 8px; border: 1.5px solid var(--border-color); font-family: 'Poppins', sans-serif; font-size: 0.9rem; cursor: pointer; }
        .modal-buttons .btn-cancel { background: var(--bg-primary); color: var(--text-primary); }
        .modal-buttons .btn-add { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        @media (max-width: 768px) {
            .year-grid { grid-template-columns: repeat(2, 1fr); }
            .month-view td { height: 70px; }
            .month-view .date-circle { width: 28px; height: 28px; font-size: 0.8rem; }
        }
    </style>
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <div class="cal-page">
            <h1>Calendar</h1>
            <div class="cal-view-toggle">
                <button class="active" data-view="year">Year</button>
                <button data-view="month">Month</button>
                <button data-view="day">Day</button>
            </div>
            <div class="cal-nav">
                <button id="nav-prev">&larr;</button>
                <span id="nav-label"></span>
                <button id="nav-next">&rarr;</button>
            </div>
            <div id="cal-content"></div>
        </div>
    </main>

    <!-- Add event modal -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal-card">
            <h3>Add happening</h3>
            <input type="text" id="event-input" placeholder="Enter event name...">
            <div class="modal-buttons">
                <button class="btn-cancel" id="event-cancel">Cancel</button>
                <button class="btn-add" id="event-add">Add</button>
            </div>
        </div>
    </div>

    <script>
    const STORAGE_KEY = 'floorplan_calendar_events';
    function loadEvents() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
        } catch (_) {}
        return { "2026-08-17": ["Going home"] };
    }
    function saveEvents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(EVENTS));
    }
    let EVENTS = loadEvents();

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    let view = 'year';
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let viewDay = new Date().getDate();

    const navLabel = document.getElementById('nav-label');
    const content = document.getElementById('cal-content');
    const viewBtns = document.querySelectorAll('.cal-view-toggle button');
    const modalOverlay = document.getElementById('event-modal');
    const eventInput = document.getElementById('event-input');
    const eventCancel = document.getElementById('event-cancel');
    const eventAdd = document.getElementById('event-add');
    let pendingDateKey = null;

    function getMonthData(year, month) {
        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        return { startDay: (first.getDay() + 6) % 7, daysInMonth: last.getDate() };
    }

    function dateKey(year, month, day) { return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
    function hasEvents(year, month, day) { return EVENTS[dateKey(year, month, day)]; }
    function getEvents(year, month, day) { return EVENTS[dateKey(year, month, day)] || []; }

    function isToday(year, month, day) {
        const n = new Date();
        return n.getFullYear() === year && n.getMonth() === month && n.getDate() === day;
    }
    function isPast(year, month, day) {
        return new Date(year, month, day) < new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
    }

    function openAddModal(key) {
        pendingDateKey = key;
        eventInput.value = '';
        modalOverlay.classList.add('open');
        eventInput.focus();
    }

    function closeAddModal() {
        modalOverlay.classList.remove('open');
        pendingDateKey = null;
    }

    eventCancel.addEventListener('click', closeAddModal);
    eventAdd.addEventListener('click', () => {
        const text = eventInput.value.trim();
        if (!text || !pendingDateKey) return;
        if (!EVENTS[pendingDateKey]) EVENTS[pendingDateKey] = [];
        EVENTS[pendingDateKey].push(text);
        saveEvents();
        closeAddModal();
        render();
    });
    eventInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') eventAdd.click();
        if (e.key === 'Escape') closeAddModal();
    });
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeAddModal();
    });

    function renderYear() {
        navLabel.textContent = viewYear;
        let html = `<button class="add-event-top" data-addkey="${viewYear}-01-01">+ Add happening</button>`;
        html += '<div class="year-grid">';
        for (let m = 0; m < 12; m++) {
            const { startDay, daysInMonth } = getMonthData(viewYear, m);
            html += `<div class="year-month"><h3>${MONTHS[m]}</h3><table>`;
            html += '<thead><tr>';
            DAYS_SHORT.forEach(d => html += `<th>${d}</th>`);
            html += '</tr></thead><tbody><tr>';
            for (let i = 0; i < startDay; i++) html += '<td></td>';
            for (let d = 1; d <= daysInMonth; d++) {
                const tdCls = [];
                if (isToday(viewYear, m, d)) tdCls.push('today');
                if (isPast(viewYear, m, d)) tdCls.push('past');
                if (hasEvents(viewYear, m, d)) tdCls.push('has-event');
                html += `<td class="${tdCls.join(' ')}"><span class="date-circle">${d}</span></td>`;
                if (((startDay + d - 1) % 7) === 6 && d < daysInMonth) html += '</tr><tr>';
            }
            const lastCell = (startDay + daysInMonth) % 7;
            if (lastCell !== 0) for (let i = lastCell; i < 7; i++) html += '<td></td>';
            html += '</tr></tbody></table></div>';
        }
        html += '</div>';
        content.innerHTML = html;
    }

    function renderMonth() {
        navLabel.textContent = `${MONTHS[viewMonth]} ${viewYear}`;
        const key = dateKey(viewYear, viewMonth, 1);
        let html = `<button class="add-event-top" data-addkey="${key}">+ Add happening</button>`;
        html += '<div class="month-view-wrap"><table class="month-view"><thead><tr>';
        DAYS_SHORT.forEach(d => html += `<th>${d}</th>`);
        html += '</tr></thead><tbody><tr>';
        for (let i = 0; i < startDay; i++) html += '<td></td>';
        for (let d = 1; d <= daysInMonth; d++) {
            const tdCls = [];
            if (isToday(viewYear, viewMonth, d)) tdCls.push('today');
            if (isPast(viewYear, viewMonth, d)) tdCls.push('past');
            html += `<td class="${tdCls.join(' ')}">`;
            html += `<span class="date-circle">${d}</span>`;
            const events = getEvents(viewYear, viewMonth, d);
            events.forEach(e => html += `<span class="event-line">${e}</span>`);
            html += '</td>';
            if (((startDay + d - 1) % 7) === 6 && d < daysInMonth) html += '</tr><tr>';
        }
        const lastCell = (startDay + daysInMonth) % 7;
        if (lastCell !== 0) for (let i = lastCell; i < 7; i++) html += '<td></td>';
        html += '</tr></tbody></table></div>';
        content.innerHTML = html;
    }

    function renderDay() {
        const d = new Date(viewYear, viewMonth, viewDay);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        navLabel.textContent = d.toLocaleDateString('en-US', options);
        const events = getEvents(viewYear, viewMonth, viewDay);
        const key = dateKey(viewYear, viewMonth, viewDay);
        let html = '<div class="day-view">';
        html += '<div class="day-body">';
        if (events.length === 0) {
            html += '<p class="day-empty">No events on this day.</p>';
        } else {
            events.forEach(e => html += `<div class="day-event"><strong>${e}</strong></div>`);
        }
        html += '</div>';
        html += `<button class="add-event-bottom" data-addkey="${key}">+ Add happening</button>`;
        html += '</div>';
        content.innerHTML = html;
    }

    function render() {
        if (view === 'year') renderYear();
        else if (view === 'month') renderMonth();
        else renderDay();
    }

    document.getElementById('nav-prev').addEventListener('click', () => {
        if (view === 'year') { viewYear--; }
        else if (view === 'month') { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } }
        else { viewDay--; if (viewDay < 1) { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } const { daysInMonth } = getMonthData(viewYear, viewMonth); viewDay = daysInMonth; } }
        render();
    });

    document.getElementById('nav-next').addEventListener('click', () => {
        if (view === 'year') { viewYear++; }
        else if (view === 'month') { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
        else { const { daysInMonth } = getMonthData(viewYear, viewMonth); viewDay++; if (viewDay > daysInMonth) { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } viewDay = 1; } }
        render();
    });

    viewBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            viewBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            view = btn.dataset.view;
            const now = new Date();
            viewYear = now.getFullYear();
            viewMonth = now.getMonth();
            viewDay = now.getDate();
            render();
        });
    });

    content.addEventListener('click', (e) => {
        const addBtn = e.target.closest('.add-event-top, .add-event-bottom');
        if (addBtn) {
            const key = addBtn.dataset.addkey;
            if (view === 'year') {
                const year = parseInt(key);
                openAddModal(`${year}-01-01`);
            } else if (view === 'month') {
                openAddModal(key);
            } else {
                openAddModal(key);
            }
            return;
        }
        if (view === 'month') {
            const td = e.target.closest('td');
            if (td) {
                const circle = td.querySelector('.date-circle');
                if (circle) {
                    view = 'day';
                    viewDay = parseInt(circle.textContent);
                    viewBtns.forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-view="day"]').classList.add('active');
                    render();
                }
            }
        }
    });

    render();
    </script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
