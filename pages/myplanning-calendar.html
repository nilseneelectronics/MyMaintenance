<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCalendar - MyMaintenance</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .cal-page { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
        .cal-page h1 { text-align: center; margin-bottom: 24px; }
        .cal-view-toggle { display: flex; gap: 12px; margin-bottom: 32px; justify-content: center; }
        .cal-view-toggle button { padding: 10px 28px; border: 2px solid var(--border-color); border-radius: 25px; background: var(--bg-primary); cursor: pointer; color: var(--text-primary); font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; transition: all 0.2s; }
        .cal-view-toggle button.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .cal-nav { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; min-height: 48px; }
        .cal-nav button { position: absolute; width: 36px; height: 36px; padding: 0; border: 2px solid var(--border-color); border-radius: 50%; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
        .cal-nav button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .cal-nav button:first-child { left: 0; }
        .cal-nav button:last-child { right: 0; }
        .cal-nav button:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .cal-nav span { font-size: 1.5rem; font-weight: 600; text-align: center; padding: 0 54px; }

        #cal-content { min-height: 560px; }

        .add-event-top { width: 100%; padding: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background: transparent; color: var(--accent-primary); font-family: 'Poppins', sans-serif; font-size: 0.95rem; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
        .add-event-top:hover { background: rgba(32,178,170,0.05); border-color: var(--accent-primary); }
        .add-event-bottom { display: block; width: 100%; padding: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background: transparent; color: var(--accent-primary); font-family: 'Poppins', sans-serif; font-size: 0.95rem; cursor: pointer; margin-top: 20px; transition: all 0.2s; }
        .add-event-bottom:hover { background: rgba(32,178,170,0.05); border-color: var(--accent-primary); }

        /* Year grid */
        .year-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .year-month { border: 1.5px solid var(--border-color); border-radius: 12px; padding: 16px; background: var(--bg-primary); }
        .year-month h3 { margin: 0 0 8px; font-size: 1rem; text-align: center; }
        .year-month table { width: 100%; border-collapse: collapse; }
        .year-month th { font-size: 0.7rem; padding: 2px 0; color: var(--text-secondary); font-weight: 500; }
        .year-month td { text-align: center; padding: 2px 0; font-size: 0.8rem; position: relative; cursor: pointer; }
        .year-month .date-circle { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; font-size: 0.8rem; transition: background 0.15s, border-color 0.15s, color 0.15s; }
        .year-month td:hover .date-circle { background: var(--hover-bg); border-color: var(--accent-primary); color: var(--accent-primary); }
        .year-month .today .date-circle { background: var(--accent-primary); color: #fff; }
        .year-month td.has-event::after { content: ''; display: block; width: 10px; height: 2px; background: var(--accent-primary); border-radius: 2px; margin: 0 auto; margin-top: 2px; }
        .year-month td.today.has-event::after { background: #fff; }
        .year-month .past .date-circle { opacity: 0.3; }
        .year-month td.past.has-event::after { opacity: 0.35; }

        /* Month view */
        .month-view-wrap { border: 1.5px solid var(--border-color); border-radius: 12px; padding: 20px; background: var(--bg-primary); }
        .month-view { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        .month-view th { text-align: center; padding: 12px 0 32px; border-bottom: 1px solid var(--border-color); font-weight: 500; color: var(--text-secondary); }
        .month-view td { text-align: center; padding: 12px 4px 4px; vertical-align: top; height: 100px; position: relative; cursor: pointer; }
        .month-view td.empty { cursor: default; background: none; border: none; height: auto; }
        .month-view td.empty:hover { background: none; }
        .month-view .date-circle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; font-size: 0.85rem; color: var(--text-primary); margin: 0 auto 4px; transition: border-color 0.15s, background 0.15s; }
        .month-view .today .date-circle { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
        .month-view .past .date-circle { opacity: 0.35; }
        .month-view .event-line { display: block; font-size: 0.8rem; color: var(--accent-secondary); background: rgba(32,178,170,0.1); border-radius: 4px; padding: 3px 7px; margin: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
        .month-view td:not(.empty) .date-circle { border-color: var(--border-color); }
        .month-view td:not(.empty):hover { border-radius: 8px; background: var(--hover-bg); outline: 2px solid var(--accent-primary); outline-offset: -2px; }

        /* Day view */
        .day-view { max-width: 720px; margin: 0 auto; }
        .day-event { padding: 16px; border: 1.5px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; background: var(--bg-primary); cursor: pointer; transition: border-color 0.15s; }
        .day-event:hover { border-color: var(--accent-primary); }
        .day-event .ev-time { font-size: 0.9rem; color: var(--accent-primary); font-weight: 500; display: block; margin-top: 4px; }
        .day-event .ev-location { font-size: 0.95rem; color: var(--text-secondary); margin-top: 4px; }
        .day-event .ev-desc { font-size: 0.95rem; color: var(--text-secondary); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color); }
        .day-empty { text-align: center; color: var(--text-secondary); padding: 40px; }
        .add-event-bottom { display: block; width: 100%; padding: 12px; border: 1.5px dashed var(--border-color); border-radius: 10px; background: transparent; color: var(--accent-primary); font-family: 'Poppins', sans-serif; font-size: 0.95rem; cursor: pointer; margin-top: 12px; transition: all 0.2s; }
        .add-event-bottom:hover { background: rgba(32,178,170,0.05); border-color: var(--accent-primary); }

        /* Modal buttons */
        .btn-cancel-modal { padding:8px 20px; border-radius:8px; border:1.5px solid var(--border-color); background:var(--bg-primary); color:var(--text-primary); font-family:'Poppins',sans-serif; font-size:0.9rem; cursor:pointer; transition:all 0.15s; }
        .btn-cancel-modal:hover { background:var(--accent-primary); color:#fff; border-color:var(--accent-primary); }
        .btn-add-modal { padding:8px 20px; border-radius:8px; border:1.5px solid var(--accent-primary); background:var(--accent-primary); color:#fff; font-family:'Poppins',sans-serif; font-size:0.9rem; cursor:pointer; transition:all 0.15s; }
        .btn-add-modal:hover { background:var(--accent-secondary); border-color:var(--accent-secondary); }
        .btn-delete-modal { padding:8px 20px; border-radius:8px; border:1.5px solid #e74c3c; background:transparent; color:#e74c3c; font-family:'Poppins',sans-serif; font-size:0.9rem; cursor:pointer; margin-right:auto; transition:all 0.15s; }
        .btn-delete-modal:hover { background:#e74c3c; color:#fff; }

        /* Ads */
        .ads-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-color); }
        .ads-section h3 { font-size: 1rem; font-weight: 500; color: var(--text-secondary); margin: 0 0 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ad-card { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1.5px solid var(--border-color); border-radius: 12px; margin-bottom: 12px; background: var(--bg-primary); cursor: pointer; transition: all 0.2s; }
        .ad-card:hover { border-color: var(--accent-primary); }
        .ad-icon { width: 52px; height: 52px; border-radius: 10px; background: rgba(32,178,170,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ad-icon svg { width: 28px; height: 28px; fill: var(--accent-primary); }
        .ad-info { flex: 1; }
        .ad-info strong { display: block; font-size: 1.1rem; margin-bottom: 3px; }
        .ad-info span { font-size: 0.95rem; color: var(--text-secondary); }
        .ad-badge { font-size: 0.8rem; background: var(--accent-primary); color: #fff; padding: 3px 10px; border-radius: 20px; font-weight: 500; flex-shrink: 0; }

        @media (max-width: 768px) {
            .year-grid { grid-template-columns: repeat(2, 1fr); }
            .month-view td { height: 70px; }
            .month-view .date-circle { width: 28px; height: 28px; font-size: 0.8rem; }
        }
    </style>
</head>
<body class="sidebar-open logged-in">

                <button onclick="history.back()" style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;padding:10px 28px;border:2px solid var(--border-color);border-radius:25px;background:var(--bg-primary);cursor:pointer;color:var(--text-primary);font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent-primary)';this.style.color='var(--accent-primary)'" onmouseout="this.style.borderColor='var(--border-color)';this.style.color='var(--text-primary)'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>

                    <input type="date" id="ev-finish-date" onclick="this.showPicker()">
                </div>
            </div>
            <div class="event-modal-row">
                <div class="event-modal-field">

                    <input type="time" id="ev-start-time" onclick="this.showPicker()">

                <label><svg class="field-icon" viewBox="0 -960 960 960"><path d="m554-577-57-57-145 144q-6 6-9 13.5t-3 15.5v21q0 8 6 14t14 6h21q8 0 15.5-3t13.5-9l144-145Zm29-29 28-28q5-5 5-10.5t-5-10.5l-36-36q-5-5-10.5-5t-10.5 5l-28 28 57 57ZM480-186q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm-28 74q-14-5-25-15-65-60-115-117t-83.5-110.5q-33.5-53.5-51-103T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 45-17.5 94.5t-51 103Q698-301 648-244T533-127q-11 10-25 15t-28 5q-14 0-28-5Zm28-448Z"/></svg>Location</label>
                <input type="text" id="ev-location" placeholder="Location">
            </div>
            <div class="event-modal-field">
                <label><svg class="field-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Description</label>

    <div class="event-modal-overlay" id="confirm-modal" style="display:none">
        <div class="event-modal-card" style="max-width:400px;text-align:center;">
            <h3 style="margin:0 0 12px;font-size:1.1rem;">Delete event</h3>
            <p id="confirm-msg" style="color:var(--text-secondary);margin:0 0 24px;font-size:0.95rem;"></p>

    <script src="../script/modules/events.js"></script>
    <script src="../script/modules/assets.js"></script>
    <script>
    const STORAGE_KEY = 'floorplan_calendar_events';
    function loadEvents() {
        return window.MyMaintenanceEvents.load();
    }
    function saveEvents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(EVENTS));
        window.dispatchEvent(new CustomEvent('myevents:changed'));
    }
    let EVENTS = loadEvents();

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    let view = 'year';
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let viewDay = new Date().getDate();

    const navLabel = document.getElementById('nav-label');
    const content = document.getElementById('cal-content');
    const viewBtns = document.querySelectorAll('.cal-view-toggle button');
    const modal = document.getElementById('event-modal');
    const evModalTitle = document.getElementById('ev-modal-title');
    const evName = document.getElementById('ev-name');
    const evStartDate = document.getElementById('ev-start-date');
    const evFinishDate = document.getElementById('ev-finish-date');
    const evStartTime = document.getElementById('ev-start-time');
    const evFinishTime = document.getElementById('ev-finish-time');
    const evLocation = document.getElementById('ev-location');
    const evDesc = document.getElementById('ev-desc');
    const evCancel = document.getElementById('ev-cancel');
    const evAdd = document.getElementById('ev-add');
    const evDelete = document.getElementById('ev-delete');
    const evPlanned = document.getElementById('ev-planned');
    const evAssetWrap = document.getElementById('ev-asset-wrap');
    const evAssetDropdown = document.getElementById('ev-asset-dropdown');
    const evAssetToggle = document.getElementById('ev-asset-toggle');
    const evAssetMenu = document.getElementById('ev-asset-menu');
    const evAssetValueEl = document.querySelector('#ev-asset-toggle .asset-value');
    const evAssetOther = document.getElementById('ev-asset-other');
    let selectedEvAsset = '';

    function resetPlannedFields() {
        if (evPlanned) evPlanned.checked = false;
        if (evAssetWrap) evAssetWrap.style.display = 'none';
        selectedEvAsset = '';
        if (evAssetValueEl) evAssetValueEl.textContent = '-- Select an asset --';
        if (evAssetMenu) evAssetMenu.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        if (evAssetOther) { evAssetOther.value = ''; evAssetOther.style.display = 'none'; }
        if (evAssetDropdown) evAssetDropdown.classList.remove('open');
    }

    function setEvAsset(value) {
        selectedEvAsset = value;
        if (evAssetValueEl) evAssetValueEl.textContent = value;
        if (evAssetMenu) {
            evAssetMenu.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
            const btn = evAssetMenu.querySelector('button[data-value="' + value + '"]');
            if (btn) btn.classList.add('selected');
        }
        if (evAssetDropdown) evAssetDropdown.classList.remove('open');
        if (evAssetOther) {
            evAssetOther.style.display = value === '__other__' ? '' : 'none';
            if (value === '__other__') evAssetOther.focus();
        }
    }

    if (evPlanned) {
        evPlanned.addEventListener('change', () => {
            const on = evPlanned.checked;
            if (evAssetWrap) evAssetWrap.style.display = on ? '' : 'none';
            if (!on) { selectedEvAsset = ''; if (evAssetValueEl) evAssetValueEl.textContent = '-- Select an asset --'; }
        });
    }
    if (evAssetToggle) {
        evAssetToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (evAssetDropdown) evAssetDropdown.classList.toggle('open');
        });
    }
    if (evAssetMenu) {
        evAssetMenu.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-value]');
            if (!btn) return;
            setEvAsset(btn.dataset.value);
            if (evAssetValueEl) evAssetValueEl.textContent = btn.textContent;
        });
    }
    document.addEventListener('click', (e) => {
        if (evAssetDropdown && !evAssetDropdown.contains(e.target)) evAssetDropdown.classList.remove('open');
    });

    function getMonthData(year, month) {
        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        return { startDay: (first.getDay() + 6) % 7, daysInMonth: last.getDate() };
    }

    function dateKey(year, month, day) { return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`; }
    function hasEvents(year, month, day) { return EVENTS[dateKey(year, month, day)] && EVENTS[dateKey(year, month, day)].length > 0; }
    function getEvents(year, month, day) { return EVENTS[dateKey(year, month, day)] || []; }

    function isToday(year, month, day) {
        const n = new Date();
        return n.getFullYear() === year && n.getMonth() === month && n.getDate() === day;
    }
    function isPast(year, month, day) {
        return new Date(year, month, day) < new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
    }

    function pad(n) { return String(n).padStart(2,'0'); }

    function defaultTimes() {
        const now = new Date();
        const mins = now.getMinutes();
        const rounded = new Date(now);
        rounded.setMinutes(Math.ceil(mins / 15) * 15, 0, 0);
        const h = String(rounded.getHours()).padStart(2,'0');
        const m = String(rounded.getMinutes()).padStart(2,'0');
        const later = new Date(rounded.getTime() + 60*60*1000);
        const h2 = String(later.getHours()).padStart(2,'0');
        const m2 = String(later.getMinutes()).padStart(2,'0');
        evStartTime.value = `${h}:${m}`;
        evFinishTime.value = `${h2}:${m2}`;
    }

    var editingKey = null;
    var editingIdx = -1;
    var pendingDelete = null;

    const confirmModal = document.getElementById('confirm-modal');
    const confirmMsg = document.getElementById('confirm-msg');
    const confirmYes = document.getElementById('confirm-yes');
    const confirmNo = document.getElementById('confirm-no');

    function openModal(key, idx) {
        modal.classList.add('open');
        editingKey = key;
        editingIdx = idx !== undefined ? idx : -1;
        if (idx >= 0 && EVENTS[key] && EVENTS[key][idx]) {
            const e = EVENTS[key][idx];
            evModalTitle.textContent = 'Edit event';
            evAdd.textContent = 'Save';
            evDelete.style.display = '';
            evName.value = e.name || '';
            evStartDate.value = e.startDate || key;
            evFinishDate.value = e.finishDate || key;
            evStartTime.value = e.startTime || '';
            evFinishTime.value = e.finishTime || '';
            evLocation.value = e.location || '';
            evDesc.value = e.description || '';
            resetPlannedFields();
            if (e.isPlannedMaintenance) {
                if (evPlanned) evPlanned.checked = true;
                if (evAssetWrap) evAssetWrap.style.display = '';
                const a = e.asset || '';
                if (a) setEvAsset(a);
            }
        } else {
            evModalTitle.textContent = 'Add event';
            evAdd.textContent = 'Add';
            evDelete.style.display = 'none';
            evName.value = '';
            evStartDate.value = key;
            evFinishDate.value = key;
            defaultTimes();
            evLocation.value = '';
            evDesc.value = '';
            resetPlannedFields();
        }
        evName.focus();
    }

    function closeModal() {
        modal.classList.remove('open');
        editingKey = null;
        editingIdx = -1;
    }

    evCancel.addEventListener('click', closeModal);
    evDelete.addEventListener('click', () => {
        if (!editingKey || editingIdx < 0) return;
        confirmMsg.textContent = 'Delete "' + (EVENTS[editingKey][editingIdx].name || 'event') + '"? This cannot be undone.';
        confirmModal.style.display = 'flex';
    });
    confirmYes.addEventListener('click', () => {
        if (!editingKey || editingIdx < 0) { confirmModal.style.display = 'none'; return; }
        EVENTS[editingKey].splice(editingIdx, 1);
        if (EVENTS[editingKey].length === 0) delete EVENTS[editingKey];
        saveEvents();
        confirmModal.style.display = 'none';
        closeModal();
        render();
    });
    confirmNo.addEventListener('click', () => { confirmModal.style.display = 'none'; });
    confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.style.display = 'none'; });
    evAdd.addEventListener('click', () => {
        const name = evName.value.trim();
        const startDate = evStartDate.value;
        const finishDate = evFinishDate.value;
        const startTime = evStartTime.value;
        const finishTime = evFinishTime.value;
        const location = evLocation.value.trim();
        const description = evDesc.value.trim();
        if (!name || !startDate) return;
        const isPlanned = !!(evPlanned && evPlanned.checked);
        const asset = isPlanned ? selectedEvAsset : '';
        if (editingKey && editingIdx >= 0) {
            if (!EVENTS[editingKey]) EVENTS[editingKey] = [];
            EVENTS[editingKey][editingIdx] = { name, startDate, finishDate, startTime, finishTime, location, description, isPlannedMaintenance: isPlanned, asset };
        } else {
            if (!EVENTS[startDate]) EVENTS[startDate] = [];
            EVENTS[startDate].push({ name, startDate, finishDate, startTime, finishTime, location, description, isPlannedMaintenance: isPlanned, asset });
        }
        saveEvents();
        closeModal();
        render();
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    evName.addEventListener('keydown', (e) => { if (e.key === 'Enter') evAdd.click(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    function renderYear() {
        navLabel.textContent = viewYear;
        const todayKey = dateKey(viewYear, new Date().getMonth(), new Date().getDate());
        let html = `<button class="add-event-top" data-key="${todayKey}">+ Add event</button>`;
        html += '<div class="year-grid">';
        for (let m = 0; m < 12; m++) {
            const { startDay, daysInMonth } = getMonthData(viewYear, m);
            html += `<div class="year-month"><h3>${MONTHS[m]}</h3><table>`;
            html += '<thead><tr>';
            DAYS_SHORT.forEach(d => html += `<th>${d}</th>`);
            html += '</tr></thead><tbody><tr>';
            for (let i = 0; i < startDay; i++) html += '<td></td>';
            for (let d = 1; d <= daysInMonth; d++) {
                const tdCls = [];
                if (isToday(viewYear, m, d)) tdCls.push('today');
                if (isPast(viewYear, m, d)) tdCls.push('past');
                if (hasEvents(viewYear, m, d)) tdCls.push('has-event');
                const key = dateKey(viewYear, m, d);
                html += `<td class="${tdCls.join(' ')}" data-key="${key}"><span class="date-circle">${d}</span></td>`;
                if (((startDay + d - 1) % 7) === 6 && d < daysInMonth) html += '</tr><tr>';
            }
            const lastCell = (startDay + daysInMonth) % 7;
            if (lastCell !== 0) for (let i = lastCell; i < 7; i++) html += '<td></td>';
            html += '</tr></tbody></table></div>';
        }
        html += '</div>';
        content.innerHTML = html;
    }

    function renderMonth() {
        navLabel.textContent = `${MONTHS[viewMonth]} ${viewYear}`;
        const { startDay, daysInMonth } = getMonthData(viewYear, viewMonth);
        const todayKey = dateKey(viewYear, viewMonth, Math.min(viewDay, daysInMonth));
        let html = `<button class="add-event-top" data-key="${todayKey}">+ Add event</button>`;
        html += '<div class="month-view-wrap"><table class="month-view"><thead><tr>';
        DAYS_SHORT.forEach(d => html += `<th>${d}</th>`);
        html += '</tr></thead><tbody><tr>';
        for (let i = 0; i < startDay; i++) html += '<td class="empty"></td>';
        for (let d = 1; d <= daysInMonth; d++) {
            const tdCls = [];
            if (isToday(viewYear, viewMonth, d)) tdCls.push('today');
            if (isPast(viewYear, viewMonth, d)) tdCls.push('past');
            const key = dateKey(viewYear, viewMonth, d);
            html += `<td class="${tdCls.join(' ')}" data-key="${key}">`;
            html += `<span class="date-circle">${d}</span>`;
            const events = getEvents(viewYear, viewMonth, d);
            events.forEach(e => {
                html += `<span class="event-line">${e.name}</span>`;
            });
            html += '</td>';
            if (((startDay + d - 1) % 7) === 6 && d < daysInMonth) html += '</tr><tr>';
        }
        const lastCell = (startDay + daysInMonth) % 7;
        if (lastCell !== 0) {
            for (let i = lastCell; i < 7; i++) html += '<td class="empty"></td>';
        }
        html += '</tr></tbody></table></div>';
        content.innerHTML = html;
    }

    function renderDay() {
        const d = new Date(viewYear, viewMonth, viewDay);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        navLabel.textContent = d.toLocaleDateString('en-US', options);
        const events = getEvents(viewYear, viewMonth, viewDay);
        const key = dateKey(viewYear, viewMonth, viewDay);
        let html = '<div class="day-view">';
        if (events.length === 0) {
            html += '<p class="day-empty">No events on this day.</p>';
        } else {
            events.forEach((e, i) => {
                html += `<div class="day-event" data-key="${key}" data-idx="${i}">`;
                html += `<strong>${e.name}</strong>`;
                if (e.startDate) {
                    const sd = e.startDate.split('-');
                    const fd = e.finishDate ? e.finishDate.split('-') : null;
                    const startLabel = `${sd[2]}.${sd[1]}.${sd[0]}`;
                    const finishLabel = fd ? `${fd[2]}.${fd[1]}.${fd[0]}` : '';
                    let timeStr = `${startLabel}${finishLabel ? ' - '+finishLabel : ''}`;
                    if (e.startTime) timeStr += ` &middot; ${e.startTime}${e.finishTime ? '-'+e.finishTime : ''}`;
                    html += `<span class="ev-time">${timeStr}</span>`;
                }
                if (e.location) html += `<div class="ev-location">${e.location}</div>`;
                if (e.description) html += `<div class="ev-desc">${e.description}</div>`;
                html += '</div>';
            });
        }
        html += `<button class="add-event-bottom" data-key="${key}">+ Add event</button>`;
        html += '<div class="ads-section"><h3>Local finds in T&oslash;nsberg</h3>';
        html += '<div class="ad-card" onclick="window.open(\'https://www.google.com/search?q=restaurants+t%C3%B8nsberg\',\'_blank\')"><div class="ad-icon"><svg viewBox="0 0 24 24"><path d="M11 9h2v2h-2zm0 4h2v6h-2zm1-11C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div><div class="ad-info"><strong>Top Restaurants</strong><span>Discover the best places to eat in T&oslash;nsberg</span></div><span class="ad-badge">Explore</span></div>';
        html += '<div class="ad-card" onclick="window.open(\'https://www.google.com/search?q=bowling+t%C3%B8nsberg\',\'_blank\')"><div class="ad-icon"><svg viewBox="0 0 24 24"><path d="M11 9h2v2h-2zm0 4h2v6h-2zm1-11C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div><div class="ad-info"><strong>Bowling &amp; Activities</strong><span>Fun things to do with friends and family</span></div><span class="ad-badge">Explore</span></div>';
        html += '<div class="ad-card" onclick="window.open(\'https://www.google.com/search?q=things+to+do+t%C3%B8nsberg+2026\',\'_blank\')"><div class="ad-icon"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg></div><div class="ad-info"><strong>Local Events</strong><span>Concerts, markets and happenings near you</span></div><span class="ad-badge">Explore</span></div>';
        html += '</div>';
        html += '</div>';
        content.innerHTML = html;
    }

    function render() {
        if (view === 'year') renderYear();
        else if (view === 'month') renderMonth();
        else renderDay();
    }

    document.getElementById('nav-prev').addEventListener('click', () => {
        if (view === 'year') { viewYear--; }
        else if (view === 'month') { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } }
        else { viewDay--; if (viewDay < 1) { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } const { daysInMonth } = getMonthData(viewYear, viewMonth); viewDay = daysInMonth; } }
        render();
    });

    document.getElementById('nav-next').addEventListener('click', () => {
        if (view === 'year') { viewYear++; }
        else if (view === 'month') { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
        else { const { daysInMonth } = getMonthData(viewYear, viewMonth); viewDay++; if (viewDay > daysInMonth) { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } viewDay = 1; } }
        render();
    });

    viewBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            viewBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            view = btn.dataset.view;
            const now = new Date();
            viewYear = now.getFullYear();
            viewMonth = now.getMonth();
            viewDay = now.getDate();
            render();
        });
    });

    content.addEventListener('click', (e) => {
        const dayEvent = e.target.closest('.day-event');
        if (dayEvent) {
            openModal(dayEvent.dataset.key, parseInt(dayEvent.dataset.idx));
            return;
        }
        const addBtn = e.target.closest('.add-event-top, .add-event-bottom');
        if (addBtn) {
            openModal(addBtn.dataset.key);
            return;
        }
        const td = e.target.closest('td[data-key]');
        if (td) {
            const key = td.dataset.key;
            if (view !== 'day' && !e.target.closest('.event-line')) {
                const parts = key.split('-');
                view = 'day';
                viewYear = parseInt(parts[0]);
                viewMonth = parseInt(parts[1]) - 1;
                viewDay = parseInt(parts[2]);
                viewBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('[data-view="day"]').classList.add('active');
                render();
            } else {
                openModal(key);
            }
        }
    });

    render();

    const params = new URLSearchParams(window.location.search);
    const dateParam = params.get('date');
    if (dateParam) {
        const parts = dateParam.split('-');
        if (parts.length === 3) {
            view = 'day';
            viewYear = parseInt(parts[0]);
            viewMonth = parseInt(parts[1]) - 1;
            viewDay = parseInt(parts[2]);
            viewBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('[data-view="day"]').classList.add('active');
            render();
        }
    }
    </script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
