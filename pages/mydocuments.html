<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDocuments - MyMaintenance</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
        <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/documents.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/homes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <h1>MyDocuments</h1>
        <div class="grid-container" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;">
            <button type="button" class="add-button" id="doc-add-btn">Add documents</button>
            <div class="input-group">
                <input type="text" placeholder="Search documents...">
            </div>
        </div>

        <div class="grid-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Documents</h3>
                <div class="doc-sort-controls">
                    <button type="button" id="doc-sort-invert" class="doc-sort-invert" title="Invert sort direction" aria-label="Invert sort direction">
                        <svg class="doc-invert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                            <path d="M12 5.83L15.17 9l1.41-1.41L12 3 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 21l4.59-4.59L15.17 15 12 18.17z"/>
                        </svg>
                    </button>
                    <div class="custom-dropdown" id="doc-sort-dropdown">
                        <div class="dropdown-toggle">
                            <span>Date Uploaded</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <ul class="dropdown-menu">
                            <li><button type="button" data-sort="asset">Asset</button></li>
                            <li><button type="button" data-sort="alpha">Alphabetic</button></li>
                            <li><button type="button" data-sort="uploaded">Date Uploaded</button></li>
                            <li><button type="button" data-sort="performed">Date Performed</button></li>
                            <li><button type="button" data-sort="size">Size</button></li>
                            <li><button type="button" data-sort="type">Doctype</button></li>
                            <li><button type="button" data-sort="modified">Modified</button></li>
                        </ul>
                    </div>
                </div>
            </div>

<div id="doc-groups"></div>
        </div>
    </main>
    
    
    
    
    <div id="doc-add-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Add document</h3>
            <div class="done-fields">
                <label>File</label>
                <div class="doc-file-picker">
                    <button type="button" class="photo-picker-btn" id="doc-pick-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 -960 960 960" width="22" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                        Add document
                    </button>
                    <span class="doc-file-name" id="doc-file-name">No file selected</span>
                </div>
                <input type="file" id="doc-file" style="display:none">

                <label>Name</label>
                <input type="text" id="doc-name" placeholder="Document name...">

                <label>Connected Asset</label>
                <div class="asset-dropdown" id="doc-asset-dropdown">
                    <button type="button" class="asset-toggle" id="doc-asset-toggle">
                        <span class="asset-value">-- Select an asset --</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="asset-menu" id="doc-asset-menu">
                        <li class="asset-optgroup">Addresses</li>
                        <li><button type="button" data-value="Address 1, Street 123, 5000 City">Address 1, Street 123, 5000 City</button></li>
                        <li><button type="button" data-value="Address 2 - Cabin, Mountain Road 45, 6000 City">Address 2 - Cabin, Mountain Road 45, 6000 City</button></li>
                        <li class="asset-optgroup">Vehicles</li>
                        <li><button type="button" data-value="Car 1 - Tesla Model Y">Car 1 - Tesla Model Y</button></li>
                        <li><button type="button" data-value="Car 2 - Volvo XC90">Car 2 - Volvo XC90</button></li>
                        <li><button type="button" data-value="Boat - Bayliner 255">Boat - Bayliner 255</button></li>
                        <li class="asset-optgroup"></li>
                        <li><button type="button" data-value="__other__">Other</button></li>
                    </ul>
                </div>
                <input type="text" id="doc-asset-other" placeholder="Specify asset..." style="display:none">

                <label>Date performed</label>
                <div class="doc-datepicker">
                    <input type="text" class="doc-date-field" id="doc-performed" placeholder="dd/mm/yyyy" autocomplete="off">
                    <div class="doc-calendar" id="doc-cal-performed"></div>
                </div>

                <label>Date uploaded</label>
                <input type="text" class="doc-date-field" id="doc-uploaded" readonly>

                <label>Size</label>
                <input type="text" id="doc-size" readonly>
            </div>
            <div class="popup-buttons">
                <button type="button" class="popup-btn cancel" id="doc-cancel">Cancel</button>
                <button type="button" class="popup-btn confirm" id="doc-save">Save</button>
            </div>
        </div>
    </div>
    <div id="doc-old-date-popup" class="popup-overlay">
        <div class="popup-content">
            <p class="doc-confirm-msg">The date is old (before 1900). Is the correct date selected?</p>
            <p class="doc-confirm-date" id="doc-old-date-text"></p>
            <div class="popup-buttons">
                <button type="button" class="popup-btn cancel" id="doc-old-cancel">Cancel</button>
                <button type="button" class="popup-btn confirm" id="doc-old-confirm">Confirm</button>
            </div>
        </div>
    </div>
    <script src="../script/pages/mydocuments.js"></script>
    <script src="../script/modules/pdfviewer.js"></script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
