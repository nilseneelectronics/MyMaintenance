<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedlikeholdt</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/documents.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/homes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <div class="planning-content" id="project-context-header" style="margin-bottom:30px; padding-top:40px;">
            <div style="position:relative;">
                <button onclick="history.back()" style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;padding:10px 28px;border:2px solid var(--border-color);border-radius:25px;background:var(--bg-primary);cursor:pointer;color:var(--text-primary);font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent-primary)';this.style.color='var(--accent-primary)'" onmouseout="this.style.borderColor='var(--border-color)';this.style.color='var(--text-primary)'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>
                <h1 style="margin:0;text-align:center;" id="project-title">Project</h1>
            </div>
        </div>

        <div class="grid-container" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;">
            <div class="button-group">
                <button type="button" class="add-button" id="project-add-doc-btn">Add document</button>
                <button type="button" class="view-button" id="project-edit-btn">Edit project</button>
            </div>
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="project-doc-search" placeholder="Search documents..." autocomplete="off">
            </div>
            <div id="project-overview"></div>
        </div>

        <div class="grid-container">
            <div id="project-doc-list"></div>
        </div>
    </main>

    <div id="project-edit-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Edit project</h3>
            <div class="done-fields">
                <label>Project name</label>
                <input type="text" id="project-edit-name" placeholder="Project name...">
            </div>
            <div class="popup-buttons">
                <button type="button" class="popup-btn cancel" id="project-edit-cancel">Cancel</button>
                <button type="button" class="popup-btn delete" id="project-edit-delete" style="display:none;">Delete project</button>
                <button type="button" class="popup-btn confirm" id="project-edit-save">Save</button>
            </div>
        </div>
    </div>

    <div id="doc-add-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Add document</h3>
            <div class="done-fields">
                <label>File</label>
                <div class="doc-file-picker">
                    <button type="button" class="photo-picker-btn" id="doc-pick-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 -960 960 960" width="22" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                        <span id="doc-pick-label">Add document</span>
                    </button>
                    <span class="doc-file-name" id="doc-file-name">No file selected</span>
                </div>
                <input type="file" id="doc-file" style="display:none">

                <label>Name</label>
                <input type="text" id="doc-name" placeholder="Document name...">

                <label id="doc-asset-label">Connected Asset</label>
                <div class="asset-dropdown" id="doc-asset-dropdown">
                    <button type="button" class="asset-toggle" id="doc-asset-toggle">
                        <span class="asset-value">-- Select an asset --</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="asset-menu" id="doc-asset-menu"></ul>
                </div>
                <input type="text" id="doc-asset-other" placeholder="Specify asset..." style="display:none">

                <label>Project</label>
                <div class="asset-dropdown" id="doc-project-dropdown">
                    <button type="button" class="asset-toggle" id="doc-project-toggle">
                        <span class="asset-value">Other</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="asset-menu" id="doc-project-menu">
                        <li><button type="button" data-value="__other__">Other</button></li>
                    </ul>
                </div>
                <input type="text" id="doc-project-other" placeholder="Project name..." style="display:none">

                 <label>Doc type</label>
                 <div class="asset-dropdown" id="doc-type-dropdown">
                    <button type="button" class="asset-toggle" id="doc-type-toggle">
                        <span class="asset-value">-- Select type --</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="asset-menu" id="doc-type-menu">
                        <li><button type="button" data-value="Receipt">Receipt</button></li>
                        <li><button type="button" data-value="Documentation">Documentation</button></li>
                        <li><button type="button" data-value="Warranty">Warranty</button></li>
                        <li><button type="button" data-value="Contract">Contract</button></li>
                        <li><button type="button" data-value="Invoice">Invoice</button></li>
                        <li><button type="button" data-value="Manual">Manual</button></li>
                        <li><button type="button" data-value="Picture">Picture</button></li>
                        <li><button type="button" data-value="Other">Other</button></li>
                     </ul>
                 </div>

                 <label>Receipt total (kr)</label>
                 <input type="text" id="doc-receipt-total" placeholder="Total amount..." inputmode="decimal">

                 <label>Date performed</label>
                <div class="doc-datepicker">
                    <input type="text" class="doc-date-field" id="doc-performed" placeholder="dd/mm/yyyy" autocomplete="off" inputmode="numeric" pattern="[0-9/]*" enterkeyhint="done">
                    <div class="doc-calendar" id="doc-cal-performed"></div>
                </div>

                <label>Date uploaded</label>
                <input type="text" class="doc-date-field" id="doc-uploaded" readonly>

                <label>Size</label>
                <input type="text" id="doc-size" readonly>
            </div>
            <div class="popup-buttons">
                <button type="button" class="popup-btn cancel" id="doc-cancel">Cancel</button>
                <button type="button" class="popup-btn confirm" id="doc-save">Save</button>
            </div>
        </div>
    </div>
    <div id="doc-old-date-popup" class="popup-overlay">
        <div class="popup-content">
            <p class="doc-confirm-msg">The date is old (before 1900). Is the correct date selected?</p>
            <p class="doc-confirm-date" id="doc-old-date-text"></p>
            <div class="popup-buttons">
                <button type="button" class="popup-btn cancel" id="doc-old-cancel">Cancel</button>
                <button type="button" class="popup-btn confirm" id="doc-old-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <button id="doc-add-btn" style="display:none;"></button>

    <script src="../script/modules/assets.js"></script>
    <script src="../script/pages/mydocuments.js"></script>
    <script src="../script/pages/myproject.js"></script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/projects-cloud.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
