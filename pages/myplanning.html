<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPlanning - MyMaintenance</title>
        <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/documents.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/homes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <h1>MyPlanning</h1>

        <!-- UPCOMING EVENTS -->
        <div class="planning-content">
            <div class="upcoming-box">
                <h3>Upcoming events</h3>
                
                <div id="upcoming-events"></div>
                
                <button class="view-button" onclick="window.location.href='myplanning-events.html'">
                    Show all
                </button>
            </div>

            <!-- Calendar -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <h3>Calendar</h3>
                    <div class="calendar-nav">
                        <button id="cal-prev" class="cal-nav-btn" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
                        <button id="cal-next" class="cal-nav-btn" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
                    </div>
                </div>
                
                <div class="calendar-mimic" id="calendar-container">
                </div>
                
                <div class="button-group">
                    <button class="add-button" id="plan-add-event">Add event</button>
                    <button class="view-button" onclick="window.location.href='myplanning-calendar.html'">View full calendar</button>
                </div>
            </div>
        </div>

        <!-- TO-DO LIST -->
        <div class="planning-content">
            <div class="todo-box">
                <h3>To-Do List</h3>
                
                <ul id="todo-list" class="todo-list"></ul>
                
                <!-- Add row: 75% input + 25% button, same height -->
                <div class="add-todo">
                    <input type="text" id="new-todo-input" placeholder="Add new task...">
                    <button id="add-todo-btn" class="add-button">Add</button>
                </div>

                <!-- View done tasks -->
                <div class="done-section">
                    <button class="view-button" id="view-done-btn">View done tasks</button>
                </div>
            </div>
        </div>

    </main>

    <!-- MARK AS DONE POPUP -->
    <div id="done-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Mark as done</h3>
            <p id="done-task-text" class="popup-task"></p>

            <div class="done-fields">
                <label>Assets</label>
                <div class="asset-dropdown" id="done-asset-dropdown">
                    <button type="button" class="asset-toggle" id="done-asset-toggle">
                        <span class="asset-value">-- Select an asset --</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <ul class="asset-menu" id="done-asset-menu">
                        <li class="asset-optgroup">Addresses</li>
                        <li><button type="button" data-value="Address 1, Street 123, 5000 City">Address 1, Street 123, 5000 City</button></li>
                        <li><button type="button" data-value="Address 2 - Cabin, Mountain Road 45, 6000 City">Address 2 - Cabin, Mountain Road 45, 6000 City</button></li>
                        <li class="asset-optgroup">Vehicles</li>
                        <li><button type="button" data-value="Car 1 - Tesla Model Y">Car 1 - Tesla Model Y</button></li>
                        <li><button type="button" data-value="Car 2 - Volvo XC90">Car 2 - Volvo XC90</button></li>
                        <li><button type="button" data-value="Boat - Bayliner 255">Boat - Bayliner 255</button></li>
                        <li class="asset-optgroup"></li>
                        <li><button type="button" data-value="__other__">Other</button></li>
                    </ul>
                </div>
                <input type="text" id="done-asset-other" placeholder="Specify asset..." style="display:none">

                <label>Equipment</label>
                <input type="text" id="done-equipment" placeholder="e.g. HVAC, Car, Roof...">

                <label>Comments</label>
                <textarea id="done-comments" rows="2" placeholder="Any comments..."></textarea>

                <label>Time used</label>
                <input type="text" id="done-time" placeholder="e.g. 2 hours">

                <label>Cost</label>
                <input type="text" id="done-cost" placeholder="e.g. 500 kr">

                <label>Pictures</label>
                <div class="done-pictures">
                    <p class="done-no-photos" id="done-no-photos">No pictures added</p>
                    <div class="done-photo-grid" id="done-photo-grid"></div>
                    <button type="button" class="photo-picker-btn" id="done-picture-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 -960 960 960" width="22" fill="currentColor"><path d="M453-280h60v-166l89 89 42-42-161-161-161 161 42 42 89-89v166Zm-299 0q-24.75 0-42.37-17.63Q94-315.25 94-340v-440q0-24.75 17.63-42.38Q129.25-840 154-840h139l56-60h220l56 60h182q24.75 0 42.38 17.62Q867-804.75 867-780v440q0 24.75-17.62 42.37Q831.75-280 807-280H154Zm0-60h653v-440H154v440Z"/></svg>
                        Add pictures
                    </button>
                    <div class="photo-picker-options" id="done-photo-options">
                        <button type="button" data-source="camera">Take picture</button>
                        <button type="button" data-source="library">Select from library</button>
                        <button type="button" data-source="documents">Select from documents</button>
                    </div>
                </div>
            </div>

            <div class="popup-buttons">
                <button id="done-cancel" class="popup-btn cancel">Cancel</button>
                <button id="done-confirm" class="popup-btn confirm">Done</button>
            </div>
        </div>
    </div>

    <div class="event-modal-overlay" id="event-modal">
        <div class="event-modal-card">
            <h3>Add event</h3>
            <div class="event-modal-field">
                <label>Name</label>
                <input type="text" id="ev-name" placeholder="Event name">
            </div>
            <div class="event-modal-row">
                <div class="event-modal-field">
                    <label>Start date</label>
                    <input type="date" id="ev-start-date" onclick="this.showPicker()">
                </div>
                <div class="event-modal-field">
                    <label>Finish date</label>
                    <input type="date" id="ev-finish-date" onclick="this.showPicker()">
                </div>
            </div>
            <div class="event-modal-row">
                <div class="event-modal-field">
                    <label>Start time</label>
                    <input type="time" id="ev-start-time" onclick="this.showPicker()">
                </div>
                <div class="event-modal-field">
                    <label>Finish time</label>
                    <input type="time" id="ev-finish-time" onclick="this.showPicker()">
                </div>
            </div>
            <div class="event-modal-field">
                <label>Location</label>
                <input type="text" id="ev-location" placeholder="Location">
            </div>
            <div class="event-modal-field">
                <label>Description</label>
                <textarea id="ev-desc" rows="3" placeholder="Full description..."></textarea>
            </div>
            <div class="modal-buttons" style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn-cancel" id="ev-cancel" style="padding:8px 20px;border-radius:8px;border:1.5px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-family:'Poppins',sans-serif;font-size:0.9rem;cursor:pointer;">Cancel</button>
                <button class="btn-add" id="ev-add" style="padding:8px 20px;border-radius:8px;border:1.5px solid var(--accent-primary);background:var(--accent-primary);color:#fff;font-family:'Poppins',sans-serif;font-size:0.9rem;cursor:pointer;">Add</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM DELETE POPUP -->
    <div id="delete-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Are you sure you want to delete the task</h3>
            <p id="popup-task-text" class="popup-task"></p>
            
            <div class="popup-buttons">
                <button id="popup-no" class="popup-btn cancel">NO</button>
                <button id="popup-yes" class="popup-btn delete">YES</button>
            </div>
        </div>
    </div>

    
    
    
    
    <script src="../script/pages/myplanning.js"></script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
