<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPlanning - MyMaintenance</title>
        <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/documents.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/homes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <h1>MyPlanning</h1>

        <!-- UPCOMING EVENTS -->
        <div class="planning-content">
            <div class="upcoming-box">
                <h3>Upcoming events</h3>
                
                <a href="event-roof-inspection.html" class="box-item-link">Roof inspection – 15 March 2026</a>
                <a href="event-hvac-service.html" class="box-item-link">HVAC service – 2 April 2026</a>
                <a href="event-car-oil-change.html" class="box-item-link">Car oil change – 10 April 2026</a>
                
                <button class="view-button" onclick="window.location.href='coming-soon.html?target=myplanning-events.html'">
                    Show all
                </button>
            </div>

            <!-- Calendar -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <h3>Calendar</h3>
                    <div class="calendar-nav">
                        <button id="cal-prev" class="cal-nav-btn" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
                        <button id="cal-next" class="cal-nav-btn" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
                    </div>
                </div>
                
                <div class="calendar-mimic" id="calendar-container">
                </div>
                
                <div class="button-group">
                    <button class="add-button" id="plan-add-event">Add event</button>
                    <button class="view-button" onclick="window.location.href='myplanning-calendar.html'">View full calendar</button>
                </div>
            </div>
        </div>

        <!-- TO-DO LIST -->
        <div class="planning-content">
            <div class="todo-box">
                <h3>To-Do List</h3>
                
                <ul id="todo-list" class="todo-list"></ul>
                
                <!-- Add row: 75% input + 25% button, same height -->
                <div class="add-todo">
                    <input type="text" id="new-todo-input" placeholder="Add new task...">
                    <button id="add-todo-btn" class="add-button">Add</button>
                </div>
            </div>
        </div>

    </main>

    <div class="event-modal-overlay" id="event-modal">
        <div class="event-modal-card">
            <h3>Add event</h3>
            <div class="event-modal-field">
                <label>Name</label>
                <input type="text" id="ev-name" placeholder="Event name">
            </div>
            <div class="event-modal-row">
                <div class="event-modal-field">
                    <label>Start date</label>
                    <input type="date" id="ev-start-date" onclick="this.showPicker()">
                </div>
                <div class="event-modal-field">
                    <label>Finish date</label>
                    <input type="date" id="ev-finish-date" onclick="this.showPicker()">
                </div>
            </div>
            <div class="event-modal-row">
                <div class="event-modal-field">
                    <label>Start time</label>
                    <input type="time" id="ev-start-time" onclick="this.showPicker()">
                </div>
                <div class="event-modal-field">
                    <label>Finish time</label>
                    <input type="time" id="ev-finish-time" onclick="this.showPicker()">
                </div>
            </div>
            <div class="event-modal-field">
                <label>Location</label>
                <input type="text" id="ev-location" placeholder="Location">
            </div>
            <div class="event-modal-field">
                <label>Description</label>
                <textarea id="ev-desc" rows="3" placeholder="Full description..."></textarea>
            </div>
            <div class="modal-buttons" style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn-cancel" id="ev-cancel" style="padding:8px 20px;border-radius:8px;border:1.5px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);font-family:'Poppins',sans-serif;font-size:0.9rem;cursor:pointer;">Cancel</button>
                <button class="btn-add" id="ev-add" style="padding:8px 20px;border-radius:8px;border:1.5px solid var(--accent-primary);background:var(--accent-primary);color:#fff;font-family:'Poppins',sans-serif;font-size:0.9rem;cursor:pointer;">Add</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM DELETE POPUP -->
    <div id="delete-popup" class="popup-overlay">
        <div class="popup-content">
            <h3>Are you sure you want to delete the task</h3>
            <p id="popup-task-text" class="popup-task"></p>
            
            <div class="popup-buttons">
                <button id="popup-no" class="popup-btn cancel">NO</button>
                <button id="popup-yes" class="popup-btn delete">YES</button>
            </div>
        </div>
    </div>

    
    
    
    
    <script src="../script/pages/myplanning.js"></script>
    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
