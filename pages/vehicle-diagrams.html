<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedlikeholdt</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/grid.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/documents.css">
    <link rel="stylesheet" href="../css/planning.css">
    <link rel="stylesheet" href="../css/tools.css">
    <link rel="stylesheet" href="../css/homes.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <div class="planning-content">
            <div style="position:relative;">
                <button onclick="history.back()" style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;padding:10px 28px;border:2px solid var(--border-color);border-radius:25px;background:var(--bg-primary);cursor:pointer;color:var(--text-primary);font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent-primary)';this.style.color='var(--accent-primary)'" onmouseout="this.style.borderColor='var(--border-color)';this.style.color='var(--text-primary)'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>
                <h1 style="margin:0;text-align:center;">Vehicle Diagrams</h1>
            </div>

            <div class="grid-container" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; margin-top: 50px; text-align:left;">
                <div class="upcoming-box" style="padding:30px;">
                    <h3 style="color:var(--accent-primary);">Under development</h3>
                    <p style="font-size:1.05rem; line-height:1.7;">
                        Vehicle diagrams are under development. The goal is to have most cars registered and a custom
                        diagram created to let you be able to select a body part of the vehicle and link maintenance.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="../script/app-config.js"></script>
    <script src="../script/modules/auth.js"></script>
    <script src="../script/modules/common-ui.js"></script>
    <script src="../script/script.js"></script>
</body>
</html>
