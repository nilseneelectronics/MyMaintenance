<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDocuments - MyMaintenance</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="sidebar-open logged-in">
    <main class="main">
        <h1>MyDocuments</h1>
        <div class="grid-container" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;">
            <a href="adddocuments.html" class="add-button">Add documents</a>
            <div class="input-group">
                <input type="text" placeholder="Search documents...">
            </div>
        </div>

        <div class="grid-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Documents</h3>
                <div class="custom-dropdown">
                    <div class="dropdown-toggle">
                        <span>Last modified</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <ul class="dropdown-menu">
                        <li><button>Connected item</button></li>
                        <li><button>Alphabetic</button></li>
                        <li><button>Date Uploaded</button></li>
                        <li><button>Date Performed</button></li>
                        <li><button>Size</button></li>
                        <li><button>Doctype</button></li>
                        <li><button>Last modified</button></li>
                        <li><button>Author</button></li>
                    </ul>
                </div>
            </div>

            <!-- Subgroup: MyHome -->
            <div class="subgroup">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center;">
                        <button class="collapse-toggle">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 12 12)"/>
                            </svg>
                        </button>
                        <h4>MyHome</h4>
                    </div>
                    <div class="custom-dropdown">
                        <div class="dropdown-toggle">
                            <span>Last modified</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <ul class="dropdown-menu">
                            <li><button>Alphabetic</button></li>
                            <li><button>Date Uploaded</button></li>
                            <li><button>Date Performed</button></li>
                            <li><button>Size</button></li>
                            <li><button>Doctype</button></li>
                            <li><button>Last modified</button></li>
                            <li><button>Author</button></li>
                        </ul>
                    </div>
                </div>
                <div class="subgroup-content">
                    <div class="doc-row">
                        <div style="display: flex; align-items: center;">
                            <svg class="doc-symbol" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#20b2aa"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                            <span class="doc-name">Name</span>
                        </div>
                        <div style="display: flex; gap: 20px;">
                            <span class="doc-date">Date Performed</span>
                            <span class="added-date">Date Uploaded</span>
                            <span class="size">Size</span>
                        </div>
                    </div>
                    <div class="doc-row">
                        <div style="display: flex; align-items: center;">
                            <svg class="doc-symbol" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#20b2aa"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                            <span class="doc-name">Name</span>
                        </div>
                        <div style="display: flex; gap: 20px;">
                            <span class="doc-date">Date Performed</span>
                            <span class="added-date">Date Uploaded</span>
                            <span class="size">Size</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Subgroup: MyVehicles -->
            <div class="subgroup">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <div style="display: flex; align-items: center;">
                        <button class="collapse-toggle">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 12 12)"/>
                            </svg>
                        </button>
                        <h4>MyVehicles</h4>
                    </div>
                    <div class="custom-dropdown">
                        <div class="dropdown-toggle">
                            <span>Last modified</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <ul class="dropdown-menu">
                            <li><button>Alphabetic</button></li>
                            <li><button>Date Uploaded</button></li>
                            <li><button>Date Performed</button></li>
                            <li><button>Size</button></li>
                            <li><button>Doctype</button></li>
                            <li><button>Last modified</button></li>
                            <li><button>Author</button></li>    
                        </ul>
                    </div>
                </div>
                <div class="subgroup-content">
                    <div class="doc-row">
                        <div style="display: flex; align-items: center;">
                            <svg class="doc-symbol" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#20b2aa"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"/></svg>
                            <span class="doc-name">Name</span>
                        </div>
                        <div style="display: flex; gap: 20px;">
                            <span class="doc-date">Date Performed</span>
                            <span class="added-date">Date Uploaded</span>
                            <span class="size">Size</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
